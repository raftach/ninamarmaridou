<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <title>Nina Marmaridou | Interior Design</title>
  <script>
    // GitHub Pages SPA redirect: encode the path and redirect to index.html
    (function () {
      var base = '/ninamarmaridou';
      var path = window.location.pathname.replace(new RegExp('^' + base), '') || '/';
      window.location.replace(
        window.location.origin + base + '/?r=' + encodeURIComponent(path)
      );
    })();
  </script>
</head>

</html>
